name: Commit and push
description: Validate and commit the given paths to main (rebasing onto any newer commits) and trigger a deploy.

inputs:
  paths:
    description: Space-separated paths to stage
    required: true
  message:
    description: Commit message
    required: true
  body:
    description: Optional commit message body
    required: false
    default: ''
  validate:
    description: Optional command run on the working tree before committing. If it fails, nothing is committed and the job fails with the output in the job summary.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Commit and push
      id: push
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        MESSAGE: ${{ inputs.message }}
        BODY: ${{ inputs.body }}
        VALIDATE: ${{ inputs.validate }}
      run: |
        git add -- $PATHS
        if git diff --cached --quiet; then
          echo "No changes to commit"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Deploys run the same checks, so committing data that fails them would
        # leave main undeployable until someone fixes it by hand.
        if [ -n "$VALIDATE" ]; then
          LOG="$RUNNER_TEMP/validate.log"
          if ! bash -c "$VALIDATE" > "$LOG" 2>&1; then
            cat "$LOG"
            git diff --cached --name-status > "$RUNNER_TEMP/changed.txt"
            {
              echo "## Data validation failed: nothing committed"
              echo
              echo "\`$VALIDATE\` rejected the synced data, so \"$MESSAGE\" was not committed and main is unchanged. Fix the upstream source, or extend the schema (\`scripts/eip-schema.json\`, \`scripts/lib/data-integrity.mjs\`) if the new value is legitimate, then rerun."
              echo
              echo "### Output"
              echo '```'
              tail -n 100 "$LOG"
              echo '```'
              echo
              echo "### Changed files ($(grep -c "" "$RUNNER_TEMP/changed.txt"), first 50)"
              echo '```'
              head -n 50 "$RUNNER_TEMP/changed.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git reset -q
            echo "::error title=Data validation failed::$VALIDATE failed on the synced data, so nothing was committed. See the job summary for details."
            exit 1
          fi
          cat "$LOG"
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if [ -n "$BODY" ]; then
          git commit -m "$MESSAGE" -m "$BODY"
        else
          git commit -m "$MESSAGE"
        fi

        # Rebase onto anything pushed to main since checkout (e.g. a maintainer
        # push mid-run) rather than failing with "rejected (fetch first)".
        for attempt in 1 2 3; do
          if ! git pull --rebase --autostash; then
            git rebase --abort || true
            echo "::error::Rebase onto main failed (conflict with a newer commit)"
            exit 1
          fi
          if git push; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Push rejected (attempt $attempt), retrying..."
          sleep $((attempt * 5))
        done
        echo "::error::Push failed after 3 attempts"
        exit 1

    # Pushes made with GITHUB_TOKEN don't trigger `push` workflows, so
    # deploy.yml has to be dispatched explicitly.
    - name: Trigger deploy
      if: steps.push.outputs.pushed == 'true'
      uses: actions/github-script@v9
      with:
        script: |
          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'deploy.yml',
            ref: 'main'
          });
