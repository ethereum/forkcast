name: Sync EIPs

on:
  schedule:
    - cron: '0 6,18 * * *' # twice daily at 06:00 and 18:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout forkcast
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Fetch EIPs
        run: node scripts/fetch-all-eips.mjs

      # Later steps still run if an earlier fetch fails part-way, so whatever
      # succeeded is committed; the job still ends red.
      - name: Fetch EIP PRs
        if: ${{ !cancelled() }}
        run: node scripts/fetch-eip-prs.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch EIP spec history
        if: ${{ !cancelled() }}
        run: node scripts/fetch-eip-history.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit, push and deploy
        if: ${{ !cancelled() }}
        uses: ./.github/actions/commit-and-push
        with:
          paths: src/data/eips/ public/eips/
          message: 'sync: update EIP data'
          validate: npm run compile-eips && npm run validate-data
