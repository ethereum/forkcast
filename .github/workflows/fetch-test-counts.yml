name: Fetch Test Counts

on:
  schedule:
    - cron: '10 6 * * *' # once daily at 06:10 UTC (staggered to avoid conflicts)
  workflow_dispatch:

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout forkcast
        uses: actions/checkout@v6

      - name: Checkout execution-specs
        uses: actions/checkout@v6
        with:
          repository: ethereum/execution-specs
          path: execution-specs
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'

      - name: Install execution-specs
        working-directory: execution-specs
        run: uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      # For the validation before committing (validate-data uses ajv).
      - name: Install dependencies
        run: npm ci

      - name: Collect test counts
        run: uv run --project execution-specs python scripts/collect-test-counts.py execution-specs src/data/execution-spec-test-counts.json

      - name: Commit, push and deploy
        uses: ./.github/actions/commit-and-push
        with:
          paths: src/data/execution-spec-test-counts.json
          message: 'sync: update execution-spec test counts'
          validate: npm run validate-data
