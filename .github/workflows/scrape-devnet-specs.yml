name: Scrape Devnet Specs

on:
  schedule:
    # Run twice daily, staggered to avoid conflicts with other sync workflows
    - cron: '20 6,18 * * *'
  workflow_dispatch:

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Scrape devnet specs
        run: node scripts/scrape-all-devnet-specs.mjs

      # Still sync and commit if some devnets failed to scrape; the job ends red.
      - name: Sync devnet launch dates
        if: ${{ !cancelled() }}
        run: node scripts/sync-devnet-launches.mjs

      - name: Commit, push and deploy
        if: ${{ !cancelled() }}
        uses: ./.github/actions/commit-and-push
        with:
          paths: src/data/devnets/ src/data/generated/devnet-launches.json
          message: 'sync: scrape devnet specs'
