# .github/workflows/sync-call-assets.yml
name: Sync Call Assets from eth/pm

on:
  schedule:
    - cron: '0 * * * *'
  repository_dispatch:
    types: [pm-assets-updated]
  workflow_dispatch:

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout forkcast
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Sync assets from eth/pm
        id: sync
        run: |
          node scripts/sync-call-assets.mjs

      # Partial failures here still commit what succeeded; the job ends red.
      - name: Extract key decisions from new TLDRs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/extract-key-decisions.mjs --all

      - name: Commit, push and deploy
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        uses: ./.github/actions/commit-and-push
        with:
          paths: public/artifacts src/data/protocol-calls.generated.json
          message: 'sync call assets from eth/pm'
          body: ${{ steps.sync.outputs.synced_paths }}
