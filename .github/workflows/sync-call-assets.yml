# .github/workflows/sync-call-assets.yml
name: Sync Call Assets from eth/pm

on:
  schedule:
    - cron: '0 * * * *'
  repository_dispatch:
    types: [pm-assets-updated]
  workflow_dispatch:

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout forkcast
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      # The LLM scripts use @anthropic-ai/sdk (a devDependency).
      - name: Install dependencies
        run: npm ci

      - name: Sync assets from eth/pm
        id: sync
        run: |
          node scripts/sync-call-assets.mjs

      - name: Find newly synced calls
        id: new_calls
        run: |
          # Call directories the sync step added or changed, e.g. acde/2026-10-08_247
          CALLS=$(git status --porcelain --untracked-files=all -- public/artifacts \
            | cut -c4- | sed 's#^public/artifacts/##' \
            | grep -oE '^[a-z0-9-]+/[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]+' | sort -u | paste -sd, - || true)
          echo "calls=$CALLS" >> "$GITHUB_OUTPUT"

      - name: Extract key decisions from new TLDRs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/extract-key-decisions.mjs --all

      # Notes and EIP mentions skip transcripts that already have output, and
      # --limit caps API calls per run so a bulk re-sync can't run up a bill.
      # A failure here shouldn't hold back the synced assets, so these steps
      # don't fail the job; rerun locally with --only <call> if one is missing.
      - name: Compile EIP index for mention extraction
        if: steps.new_calls.outputs.calls != ''
        continue-on-error: true
        run: node scripts/compile-eips.mjs

      - name: Generate call notes for newly synced calls
        if: steps.new_calls.outputs.calls != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALLS: ${{ steps.new_calls.outputs.calls }}
        run: node scripts/generate-call-notes.mjs --only "$CALLS" --limit 4

      - name: Extract EIP mentions for newly synced calls
        if: steps.new_calls.outputs.calls != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CALLS: ${{ steps.new_calls.outputs.calls }}
        run: node scripts/extract-eip-mentions.mjs --only "$CALLS" --limit 4

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          PATHS="${{ steps.sync.outputs.synced_paths }}"
          if [ -n "$PATHS" ]; then
            git commit -m "sync call assets from eth/pm" -m "$PATHS"
          else
            git commit -m "sync call assets from eth/pm"
          fi
          git push

      - name: Trigger deploy
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
